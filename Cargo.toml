[workspace]
resolver = "3"
members = [
    "crates/sgl-core",
    "crates/sgl-net",
    "crates/sgl-2d",
    "crates/sgl-input",
    "crates/sgl-3d",
    "crates/sgl-post-fx",
    "examples/direct-game",
]
default-members = [
    "crates/sgl-core",
    "crates/sgl-net",
    "crates/sgl-2d",
    "crates/sgl-input",
    "crates/sgl-3d",
    "crates/sgl-post-fx",
    "examples/direct-game",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = ["crates-io"]
version = "0.4.0"
rust-version = "1.96"
repository = "https://github.com/stevepryde/sgl"

[workspace.dependencies]
sgl-2d = { version = "0.4.0", path = "crates/sgl-2d" }
sgl-input = { version = "0.4.0", path = "crates/sgl-input" }
sgl-3d = { version = "0.4.0", path = "crates/sgl-3d" }
sgl-post-fx = { version = "0.4.0", path = "crates/sgl-post-fx" }
sgl-core = { version = "0.4.0", path = "crates/sgl-core" }
sgl-net = { version = "0.4.0", path = "crates/sgl-net" }
bcdec_rs = "0.2"
blake3 = "1.8.3"
block2 = "0.6.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
fastrand = "2.4"
fontdue = "0.9"
futures = "0.3"
gilrs = "0.11.2"
glam = "0.33.2"
gltf = "1.4"
ktx2 = "0.5"
objc2 = "0.6.4"
objc2-game-controller = { version = "0.3.2", default-features = false }
rustc-hash = "1.1"
ruzstd = { version = "0.8", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
js-sys = "0.3.104"
console_error_panic_hook = "0.1.7"
pollster = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sp-fidelity = "0.2.0"
sp-fidelity-wgpu = "0.2.0"
zeroize = "1.8"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
wasm-bindgen-test = "0.3.77"
proptest = { version = "1.11", default-features = false, features = ["std"] }
tungstenite = { version = "0.29", default-features = false, features = [
    "handshake",
] }
getrandom = "0.4.3"
mio = { version = "1.2", default-features = false, features = ["os-poll", "net"] }
wgpu = { version = "30.0.1", default-features = false }
# wgpu re-exports naga only with its native core; SGL3D's layout tests parse WGSL
# with it directly, at wgpu's version.
naga = "30.0.1"
winit = { version = "0.30.13", default-features = false }
web-sys = { version = "0.3.104", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "BinaryType",
    "CloseEvent",
    "Event",
    "MessageEvent",
    "Node",
    "Response",
    "WebSocket",
    "Window",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

# crates/sgl-input/Cargo.toml mirrors this table; change both.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# These are deliberately workspace-wide: public error and panic contracts will
# be documented when the APIs exist; crate names mirror their crate roles.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.bench]
overflow-checks = true
