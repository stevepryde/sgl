[workspace]
resolver = "3"
members = [
    "crates/sgl-core",
    "crates/sgl-physics",
    "crates/sgl-net",
    "crates/sgl-2d",
    "crates/sgl-input",
    "crates/sgl-3d",
    "crates/sgl-post-fx",
    "crates/sgl-webgpu",
    "examples/direct-game",
    "tests/sgl-core",
    "tests/sgl-physics",
    "tests/sgl-net",
    "tests/sgl-2d",
    "tests/sgl-3d",
    "tests/sgl-post-fx",
    "examples/sgl-net",
    "examples/sgl-2d",
    "examples/sgl-input",
    "examples/sgl-3d",
    "examples/sgl-webgpu",
]
default-members = [
    "crates/sgl-core",
    "crates/sgl-physics",
    "crates/sgl-net",
    "crates/sgl-2d",
    "crates/sgl-input",
    "crates/sgl-3d",
    "crates/sgl-post-fx",
    "crates/sgl-webgpu",
    "examples/direct-game",
    "tests/sgl-core",
    "tests/sgl-physics",
    "tests/sgl-net",
    "tests/sgl-2d",
    "tests/sgl-3d",
    "tests/sgl-post-fx",
    "examples/sgl-net",
    "examples/sgl-2d",
    "examples/sgl-input",
    "examples/sgl-3d",
    "examples/sgl-webgpu",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = ["crates-io"]
version = "0.10.0"
rust-version = "1.96"
repository = "https://github.com/stevepryde/sgl"

[workspace.dependencies]
sgl-2d = { version = "0.10.0", path = "crates/sgl-2d" }
sgl-input = { version = "0.10.0", path = "crates/sgl-input" }
sgl-3d = { version = "0.10.0", path = "crates/sgl-3d" }
sgl-post-fx = { version = "0.10.0", path = "crates/sgl-post-fx" }
sgl-core = { version = "0.10.0", path = "crates/sgl-core" }
sgl-physics = { version = "0.10.0", path = "crates/sgl-physics" }
sgl-net = { version = "0.10.0", path = "crates/sgl-net", default-features = false }
sgl-webgpu = { version = "0.10.0", path = "crates/sgl-webgpu" }
bcdec_rs = "0.2"
bevy_mikktspace = { version = "1.0", features = ["corrected-edge-sorting", "corrected-vertex-welding"] }
blake3 = "1.8.3"
block2 = "0.6.2"
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc"] }
fastrand = "2.4"
fontdue = { version = "0.9", default-features = false, features = ["std", "simd"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
futures-channel = "0.3"
gilrs = "0.11.2"
glam = "0.33.2"
gltf = "1.4"
ktx2 = "0.5"
objc2 = "0.6.4"
objc2-game-controller = { version = "0.3.2", default-features = false }
rustc-hash = "1.1"
ruzstd = { version = "0.8", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
js-sys = "0.3.104"
log = "0.4.29"
console_error_panic_hook = "0.1.7"
pollster = "0.4.0"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sp-fidelity = "0.3.4"
sp-fidelity-wgpu = "0.3.4"
zeroize = "1.8"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
wasm-bindgen-test = "0.3.77"
proptest = { version = "1.11", default-features = false, features = ["std"] }
tungstenite = { version = "0.29", default-features = false, features = [
    "handshake",
] }
getrandom = "0.4.3"
mio = { version = "1.2", default-features = false, features = ["os-poll", "net"] }
wgpu = { version = "30.0.1", default-features = false }
# sgl-webgpu names wgpu's types by the paths wgpu's own web backend uses.
wgpu-types = { version = "30.0.1", default-features = false }
# wgpu re-exports naga only with its native core; SGL3D's layout tests parse WGSL
# with it directly, at wgpu's version.
naga = "30.0.1"
winit = { version = "0.30.13", default-features = false }
web-sys = { version = "0.3.104", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "BinaryType",
    "CloseEvent",
    "Event",
    "MessageEvent",
    "Node",
    "Response",
    "WebSocket",
    "Window",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

# crates/sgl-input/Cargo.toml and crates/sgl-webgpu/Cargo.toml mirror this
# table; change all three.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# These are deliberately workspace-wide: public error and panic contracts will
# be documented when the APIs exist; crate names mirror their crate roles.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.dev]
overflow-checks = true

# The scenario harness decodes, filters and measures full-frame readbacks
# (supersampled references among them) on the CPU; unoptimised, that
# dominates its share of the required check.
[profile.dev.package.sgl-3d-tests]
opt-level = 2

[profile.release]
overflow-checks = true

# The build settings the guides give a browser game (#895; crates/sgl-3d/docs
# "Distributing a game"), with which `measure-browser` builds so it measures
# what a game ships. A game's own release profile has no overflow checks.
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"
overflow-checks = false

[profile.test]
overflow-checks = true

[profile.bench]
overflow-checks = true
