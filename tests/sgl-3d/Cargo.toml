[package]
name = "sgl-3d-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Integration tests for sgl-3d, kept out of its published package, and the
# scenario harness (`src/`) its scenario tests share. Like sgl-3d, exempt
# from `[workspace.lints]`.

[dependencies]
glam.workspace = true
# The harness reads the frame's targets through the diagnostics accessors.
sgl-3d = { workspace = true, features = ["diagnostics"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image.workspace = true
pollster.workspace = true
serde_json.workspace = true
wgpu.workspace = true

[dev-dependencies]
bytemuck.workspace = true
# The temporal antialiasing suite takes FSR's jitter phase count from the
# SDK port the renderer uses.
sp-fidelity.workspace = true
gltf.workspace = true
wasm-bindgen-test.workspace = true
