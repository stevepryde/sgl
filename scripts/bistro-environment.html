<script type="module">
import * as THREE from 'three';
import { RGBELoader } from '/three/examples/jsm/loaders/RGBELoader.js';
import { webGpuBakeProvenance } from '/backend.js';
window.bake = (async () => {
  async function save(path,body,headers={}) {
    const response=await fetch(path,{method:'POST',body,headers});
    if(!response.ok) throw new Error(`Could not save ${path}: HTTP ${response.status}`);
  }
  const renderer = new THREE.WebGPURenderer();
  await renderer.init();
  const adapter = await navigator.gpu?.requestAdapter({featureLevel:'compatibility'});
  const provenance = webGpuBakeProvenance(renderer, adapter);
  const panorama = await new RGBELoader().setDataType(THREE.FloatType).loadAsync('/source.hdr');
  panorama.mapping = THREE.EquirectangularReflectionMapping;
  const generator = new THREE.PMREMGenerator(renderer);
  await generator.compileEquirectangularShader();
  const filtered = generator.fromEquirectangular(panorama);
  const { width, height } = filtered;
  // SGL ports PMREMNode's lookup of the common/WebGPU generator, whose
  // render-target output has inverted Y. WebGL's generator has a different
  // convention and cannot be substituted even though the dimensions match.
  const rgba16=await renderer.readRenderTargetPixelsAsync(filtered,0,0,width,height);
  await save('/pmrem',rgba16,{'x-width':String(width),'x-height':String(height)});
  // The runtime backdrop is RGBA8 sRGB. Retain all HDR radiance in the
  // lighting atlas; clamp only this display panorama to that storage range.
  const canvas = document.createElement('canvas');
  canvas.width=1024; canvas.height=512;
  const context=canvas.getContext('2d');
  const image=context.createImageData(canvas.width,canvas.height);
  const source=panorama.image;
  for(let y=0;y<canvas.height;y++) for(let x=0;x<canvas.width;x++) {
    const from=(Math.floor(y*source.height/canvas.height)*source.width+Math.floor(x*source.width/canvas.width))*4;
    const to=(y*canvas.width+x)*4;
    for(let c=0;c<3;c++) {
      const linear=Math.min(1,Math.max(0,source.data[from+c]));
      image.data[to+c]=Math.round(255*(linear<=0.0031308?12.92*linear:1.055*linear**(1/2.4)-0.055));
    }
    image.data[to+3]=255;
  }
  context.putImageData(image,0,0);
  const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  await save('/panorama',png);
  filtered.dispose(); generator.dispose(); panorama.dispose(); renderer.dispose();
  return {width,height,three:THREE.REVISION,...provenance};
})().then(value=>({value}),error=>({error:String(error.stack||error)}));
</script>
