[package]
name = "sgl-3d"
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/sgl-3d"
categories = ["game-development", "rendering"]
keywords = ["gamedev", "wgpu", "rendering", "pbr", "webgpu"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Caller-driven 3D rendering for SGL games, native and in the browser (WebGPU)"

# Exempt from `[workspace.lints]`: GPU packing casts and wgpu descriptor
# defaults make clippy's pedantic group pervasive noise here. Unsafe code stays
# denied as specs/stack.md records (`#![deny(unsafe_code)]` in src/lib.rs).

[features]
default = []
diagnostics = ["dep:js-sys"]

[dependencies]
# Decodes a BC7 material image's level 0 for the scene's ray source.
bcdec_rs.workspace = true
bytemuck.workspace = true
sgl-post-fx.workspace = true
glam.workspace = true
gltf = { workspace = true, features = ["KHR_materials_emissive_strength", "KHR_materials_unlit", "extensions"] }
image = { workspace = true, features = ["jpeg"] }
# `Scene::add_shader` parses and validates a game's WGSL module in the
# programs it is composed into, with the naga wgpu creates modules with.
naga = { workspace = true, features = ["wgsl-in"] }
# Reads block-compressed material images from KTX2, as Bevy does.
ktx2.workspace = true
# Draw lists bin their draws by small keys each frame (view::draw_list).
rustc-hash.workspace = true
# KTX2's Zstandard supercompression, as Bevy's `zstd_rust` feature reads it.
ruzstd = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sp-fidelity.workspace = true
sp-fidelity-wgpu.workspace = true
wgpu = { workspace = true, features = ["std", "wgsl", "dx12", "metal", "vulkan", "gles", "webgpu"] }

# The diagnostics clock in the browser: the page's `performance.now()`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }

[dev-dependencies]
# The layout tests parse and validate the composed WGSL, and write the
# hardware path's programs as Vulkan's SPIR-V and DX12's HLSL.
naga = { workspace = true, features = ["wgsl-in", "spv-out", "hlsl-out"] }
pollster.workspace = true
wasm-bindgen-test.workspace = true
# Integration tests read the frame's targets through the diagnostics accessors.
# Keep this path-only: Cargo omits it when publishing, avoiding a registry self-dependency.
sgl-3d = { path = ".", features = ["diagnostics"] }

# The browser lane's smoke test (`bun scripts/tasks.ts check-browser`).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook.workspace = true
futures.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[[example]]
name = "browser_smoke"
crate-type = ["cdylib"]

# The browser lane builds it; `bun scripts/tasks.ts measure-browser` runs it.
[[example]]
name = "browser_streaming"
crate-type = ["cdylib"]
