[package]
name = "sgl-3d"
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/sgl-3d"
categories = ["game-development", "rendering"]
keywords = ["gamedev", "wgpu", "rendering", "pbr", "webgpu"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Caller-driven 3D rendering for SGL games, native and in the browser (WebGPU)"
# Test fixtures and the XeGTAO reference sources stay in the repository; the
# package keeps the agent guide, the data blobs under src/ and every licence.
include = [
    "/src",
    "!/src/stages/opaque/ambient_occlusion/reference/*",
    "/src/stages/opaque/ambient_occlusion/reference/LICENSE",
    "/docs",
    "/README.md",
    "/SOFT_EFFECTS.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/THIRD_PARTY_NOTICES.txt",
]

# Exempt from `[workspace.lints]`: GPU packing casts and wgpu descriptor
# defaults make clippy's pedantic group pervasive noise here. Unsafe code stays
# denied as specs/stack.md records (`#![deny(unsafe_code)]` in src/lib.rs).

# The browser loader (`asset::load_slice_in_browser`) is wasm32's alone.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[features]
default = ["mikktspace"]
diagnostics = []
# MikkTSpace tangent frames for glTF primitives that need one and carry none
# (`asset::TangentFrames::Generate`). Without it such a primitive keeps the
# frame of each triangle's coordinates and is listed in `Asset::ignored`.
mikktspace = ["dep:bevy_mikktspace"]

[dependencies]
# Decodes a BC7 material image's level 0 for the scene's ray source.
bcdec_rs.workspace = true
# MikkTSpace tangent frames for glTF primitives that need one and carry none
# (content::tangents), as glTF 2.0 3.7.2.1 defines absent tangents; the
# `mikktspace` feature.
bevy_mikktspace = { workspace = true, optional = true }
bytemuck.workspace = true
sgl-post-fx.workspace = true
glam.workspace = true
gltf = { workspace = true, features = ["KHR_lights_punctual", "KHR_materials_emissive_strength", "KHR_materials_unlit", "extensions", "extras"] }
image = { workspace = true, features = ["jpeg"] }
# `Scene::add_shader` parses and validates a game's WGSL module in the
# programs it is composed into, with the naga wgpu creates modules with.
naga = { workspace = true, features = ["wgsl-in"] }
# Reads block-compressed material images from KTX2, as Bevy does.
ktx2.workspace = true
# Draw lists bin their draws by small keys each frame (view::draw_list).
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sp-fidelity.workspace = true
sp-fidelity-wgpu.workspace = true
wgpu = { workspace = true, features = ["std", "wgsl", "dx12", "metal", "vulkan", "gles"] }

# The native blocking forms of the readbacks wait on their asynchronous
# forms, as `sgl-2d`'s blocking constructors do.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# In the browser `asset::load_slice_in_browser` has the browser decode a
# glTF's images (`createImageBitmap`), which the scene copies into their
# textures (`copy_external_image_to_texture`, wgpu's `web` feature). The
# diagnostics clock is the page's `performance.now()`. A compile job starts
# WebGPU's asynchronous pipeline creation through sgl-webgpu, and its slot
# settles when that resolves.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
sgl-webgpu.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "ColorSpaceConversion",
    "ImageBitmap",
    "ImageBitmapOptions",
    "PremultiplyAlpha",
    "Window",
    "WorkerGlobalScope",
] }
wgpu = { workspace = true, features = ["web"] }

[dev-dependencies]
# Existing encoder for the KTX2 fixtures.
ruzstd = { workspace = true, features = ["std"] }
# The layout tests parse and validate the composed WGSL, and write the
# hardware path's programs as Vulkan's SPIR-V and DX12's HLSL.
naga = { workspace = true, features = ["wgsl-in", "spv-out", "hlsl-out"] }
pollster.workspace = true
wasm-bindgen-test.workspace = true
# Unit tests exercise the diagnostics accessors.
# Keep this path-only: Cargo omits it when publishing, avoiding a registry self-dependency.
# Without default features, so `--no-default-features` tests the build without
# `mikktspace`.
sgl-3d = { path = ".", default-features = false, features = ["diagnostics"] }

# The floor tests validate frames on wgpu's noop backend, which reports the
# floor's limits and runs wgpu's validation without a GPU or a backend's
# shader compiler. The live probe tests read wgpu's API trace of what a
# device was asked to do.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wgpu = { workspace = true, features = ["noop", "trace"] }
