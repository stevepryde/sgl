[package]
name = "sgl-core"
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/sgl-core"
categories = ["game-development", "algorithms"]
keywords = ["gamedev", "deterministic", "collision", "animation"]
readme = "README.md"
description = "Deterministic timing, grids, hashing, animation, and collision for SGL games"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3.workspace = true
fastrand.workspace = true
glam.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true

# proptest pulls getrandom, which does not build for wasm32-unknown-unknown
# without a global cfg; property tests are native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true
