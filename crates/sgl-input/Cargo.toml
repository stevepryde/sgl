[package]
name = "sgl-input"
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/sgl-input"
categories = ["game-development"]
keywords = ["gamedev", "input", "gamepad", "controller"]
readme = "README.md"
description = "Caller-polled controller discovery, events, and held state for SGL games"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Only the macOS FFI module may use unsafe; other SGL crates' unsafe-code
# levels follow specs/stack.md. The public input API is safe Rust. Cargo cannot
# inherit `[workspace.lints]` while overriding one lint, so the clippy table
# mirrors `[workspace.lints.clippy]` in the root manifest.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
objc2-game-controller = { workspace = true, features = ["std", "block2", "GCController", "GCDevice", "GCExtendedGamepad", "GCPhysicalInputProfile", "GCControllerElement", "GCControllerAxisInput", "GCControllerButtonInput", "GCControllerDirectionPad"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
gilrs.workspace = true

[dev-dependencies]
winit = { workspace = true, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
