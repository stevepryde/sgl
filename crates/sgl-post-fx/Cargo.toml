[package]
name = "sgl-post-fx"
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/sgl-post-fx"
categories = ["game-development", "rendering"]
keywords = ["gamedev", "wgpu", "rendering", "post-processing"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "SGL wgpu post-processing effects: screen-space reflections and temporal anti-aliasing derived from DiligentFX"
# Tests and the vendored DiligentFX/DiligentCore references stay in the
# repository; the package keeps their licences, source revisions and the
# blue-noise source `post_fx_context.rs` reads.
include = [
    "/src",
    "/shaders",
    "/vendor/*/License.txt",
    "/vendor/*/source-revision.txt",
    "/vendor/DiligentFX/PostProcess/Common/src/SamplerBlueNoiseErrorDistribution_128x128_OptimizedFor_2d2d2d2d_1spp.cpp",
    "/README.md",
    "/PROVENANCE.md",
    "/LICENSE*",
    "/THIRD_PARTY_NOTICES.txt",
]
publish.workspace = true

[dependencies]
bytemuck.workspace = true
wgpu = { workspace = true, features = ["std", "wgsl", "dx12", "metal", "vulkan", "gles", "webgpu"] }

[dev-dependencies]
pollster.workspace = true

[lints.rust]
unsafe_code = "forbid"
