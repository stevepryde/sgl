[package]
name = "sgl-net"
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/sgl-net"
categories = ["game-development", "network-programming"]
keywords = ["gamedev", "networking", "udp", "websocket"]
readme = "README.md"
description = "Opaque-payload UDP, WebSocket, and in-memory game transports"
# Ship only the library, its README and licences.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["udp", "websocket"]
udp = ["dep:blake3", "dep:getrandom"]
websocket = ["dep:mio", "dep:tungstenite", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
blake3 = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true, optional = true }
mio = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true
