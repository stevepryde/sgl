[package]
name = "sgl-audio"
repository.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/sgl-audio"
categories = ["game-development", "multimedia::audio"]
keywords = ["gamedev", "audio", "spatial", "3d"]
readme = "README.md"
description = "Deterministic 3D spatialization and safe audio playback for SGL games"
# Ship only the library, its README and licences.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["playback"]
playback = [
    "dep:rodio",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
glam.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { workspace = true, optional = true, features = [
    "playback",
    "symphonia-mp3",
    "symphonia-wav",
    "symphonia-pcm",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "Event",
    "GainNode",
    "StereoPannerNode",
] }
