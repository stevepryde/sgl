<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101212">
  <meta name="description" content="Explore real SGL3D renders. Compare lighting, bloom, ambient occlusion, and anti-aliasing in Bistro and Sponza.">
  <meta property="og:title" content="SGL — Render showcase">
  <meta property="og:description" content="Real scenes. Rendered with Steve’s Game Library.">
  <meta property="og:image" content="https://sgl.inspiredjourneys.dev/renders/bistro-sunlit-4k.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <title>SGL — Render showcase</title>
</head>
<body>
  <header class="header">
    <a class="brand" href="/" aria-label="SGL home"><svg width="27" height="30" viewBox="0 0 27 30" aria-hidden="true"><path d="m13.5 1 12 7v14l-12 7-12-7V8Zm0 0v14m12-7-12 7-12-7m12 7v14" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>SGL<span>Steve’s Game Library</span></a>
    <nav aria-label="Main"><a href="https://github.com/stevepryde/sgl/tree/main/crates/sgl-3d/docs">Docs ↗</a><a href="https://github.com/stevepryde/sgl">GitHub ↗</a></nav>
  </header>
  <main>
    <div class="intro"><h1>Render showcase<span>.</span></h1><span class="eyebrow">SGL3D / WEBGPU</span></div>
    <div class="gallery-layout">
      <aside class="scene-sidebar" aria-label="Scenes">
        <h2 class="eyebrow">Scenes</h2>
        <nav aria-label="Scene gallery" id="scene-list" class="scene-list"></nav>
      </aside>
      <section class="workspace" aria-labelledby="scene-title">
        <div class="scene-heading">
          <div><p class="eyebrow" id="scene-kind"></p><h2 id="scene-title"></h2></div>
          <div id="comparison-controls" hidden>
            <div class="mode-buttons" role="group" aria-label="Comparison view"><button data-view="split" type="button">Slide</button><button data-view="toggle" type="button">Toggle</button></div>
          </div>
        </div>
        <div class="image-stage" id="stage" aria-busy="true">
          <img id="image-on" alt="" fetchpriority="high" draggable="false">
          <img id="image-off" alt="" draggable="false" hidden>
          <div class="divider" id="divider" role="slider" tabindex="0" aria-label="Comparison position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" hidden><span aria-hidden="true">‹ ›</span></div>
          <div class="image-labels" id="image-labels" aria-hidden="true" hidden><span>Off</span><span>On</span></div>
          <span class="current-state" id="current-state" aria-live="polite" hidden></span>
          <p class="image-status" id="image-status" role="status">Loading capture…</p>
        </div>
        <div class="image-toolbar"><span id="capture-info"></span><div><a id="capture-report" hidden>Capture settings ↗</a><a id="original" href="#" target="_blank" rel="noopener">Full resolution ↗</a><button id="share" type="button">Copy link</button></div></div>
        <section class="controls" aria-label="Render controls">
          <h3 class="eyebrow">Rendering features</h3>
          <div id="feature-list" class="feature-list"></div>
        </section>
        <div class="details"><div><h3>About the capture</h3><p id="scene-description"></p></div><div><h3>Scene credits</h3><p id="scene-credits"></p><a id="license" href="#">Licence & credits ↗</a></div></div>
      </section>
    </div>
    <noscript><p>Enable JavaScript to compare captures. Original renders: <a href="/renders/bistro-sunlit-4k.png">Bistro</a> · <a href="/renders/sponza.png">Sponza</a>.</p></noscript>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
