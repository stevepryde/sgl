[package]
name = "sgl-physics-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# sgl-physics examples, kept out of its published package.

[lints]
workspace = true

[dev-dependencies]
postcard.workspace = true
serde.workspace = true
sgl-2d.workspace = true
sgl-core.workspace = true
sgl-net = { workspace = true, features = ["udp"] }
sgl-physics = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
winit = { workspace = true, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
winit = { workspace = true, features = ["rwh_06"] }
