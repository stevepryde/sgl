[package]
name = "sgl-3d-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# sgl-3d examples and the browser lane's smoke test, kept out of its published
# package. Like sgl-3d, exempt from `[workspace.lints]`.

[dev-dependencies]
bytemuck.workspace = true
glam.workspace = true
image.workspace = true
# Existing encoder for the KTX2 export example.
ktx2.workspace = true
pollster.workspace = true
ruzstd = { workspace = true, features = ["std"] }
serde_json.workspace = true
# The examples report timings through the diagnostics accessors.
sgl-3d = { workspace = true, features = ["diagnostics"] }
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook.workspace = true
futures.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[[example]]
name = "browser_smoke"
crate-type = ["cdylib"]

# The browser lane builds it; `bun scripts/tasks.ts measure-browser` runs it.
[[example]]
name = "browser_streaming"
crate-type = ["cdylib"]
